<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="360" viewBox="0 0 1000 360">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29">
        <animate attributeName="stop-color" values="#0f0c29;#1a1040;#0f0c29" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#302b63">
        <animate attributeName="stop-color" values="#302b63;#2b1e5e;#302b63" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#24243e">
        <animate attributeName="stop-color" values="#24243e;#4a1e5e;#24243e" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6ec4"/>
      <stop offset="50%" stop-color="#7873f5"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>

    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#7873f5"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="360" fill="url(#bgGrad)"/>

  <g opacity="0.35">
    <circle cx="120" cy="60" r="90" fill="#7873f5">
      <animate attributeName="cy" values="60;70;60" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="300" r="120" fill="#ff6ec4">
      <animate attributeName="cy" values="300;285;300" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="940" cy="40" r="50" fill="#4ade80">
      <animate attributeName="cy" values="40;52;40" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(140,180)">
    <ellipse cx="60" cy="120" rx="85" ry="12" fill="#000" opacity="0.25"/>
    <circle cx="60" cy="58" r="46" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.5">
      <animate attributeName="r" values="34;58" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="58" r="46" fill="none" stroke="#ff6ec4" stroke-width="2" opacity="0.5">
      <animate attributeName="r" values="34;58" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <rect x="25" y="5" width="70" height="110" rx="14" fill="url(#phoneGrad)" filter="url(#glow)">
      <animate attributeName="y" values="5;0;5" dur="3.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="31" y="11" width="58" height="92" rx="9" fill="#0b1020" opacity="0.85"/>
    <rect x="38" y="72" width="44" height="6" rx="3" fill="#22d3ee">
      <animate attributeName="width" values="44;30;44" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="38" y="82" width="44" height="6" rx="3" fill="#4ade80">
      <animate attributeName="width" values="40;22;40" dur="2.3s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="38" y="92" width="44" height="6" rx="3" fill="#ff6ec4">
      <animate attributeName="width" values="36;26;36" dur="3.1s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g>
    <text x="520" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" fill="url(#titleGrad)">
      SmartPhone Addiction
      <animate attributeName="opacity" values="1;0.85;1" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="520" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#e2e8f0" opacity="0.95">
      Predicting Digital Dependency with ML
      <animate attributeName="letter-spacing" values="1;4;1" dur="4s" repeatCount="indefinite"/>
    </text>
    <g text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#94a3b8">
      <text x="520" y="245">python sklearn lightgbm xgboost blend</text>
    </g>

    <g font-family="Segoe UI, Arial, sans-serif">
      <rect x="335" y="268" width="150" height="40" rx="20" fill="#0b1020" stroke="#22d3ee" stroke-width="1.5" opacity="0.9">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/>
      </rect>
      <text x="410" y="294" text-anchor="middle" font-size="17" fill="#22d3ee">ROC-AUC 0.9653</text>

      <rect x="515" y="268" width="150" height="40" rx="20" fill="#0b1020" stroke="#4ade80" stroke-width="1.5" opacity="0.9">
        <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
      </rect>
      <text x="590" y="294" text-anchor="middle" font-size="17" fill="#4ade80">5-Fold CV</text>
    </g>
  </g>

  <text x="990" y="348" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b" opacity="0.7">
    predict · engineer · blend · win
  </text>
</svg>
